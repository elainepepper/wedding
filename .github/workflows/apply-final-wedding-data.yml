name: Apply final wedding data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-final-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Netlify and apply the versioned final lists
        shell: bash
        run: |
          expected="2026-11-03-154-seats-59-after-hours"
          expected_adjustment="2026-11-04-fatima-between-alyn-and-mirza"
          headers="$(mktemp)"
          for attempt in $(seq 1 60); do
            : > "$headers"
            if curl --fail --silent --show-error --location \
              --dump-header "$headers" --output /dev/null \
              "https://haykalelaine.com/api/site-settings"; then
              version="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="x-final-data-version" {print $2}' | tail -n 1)"
              adjustment="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="x-seating-adjustment-version" {print $2}' | tail -n 1)"
              echo "Attempt $attempt: final data ${version:-not deployed yet}; seating adjustment ${adjustment:-not deployed yet}"
              if [ "$version" = "$expected" ] && [ "$adjustment" = "$expected_adjustment" ]; then
                echo "Final lists and Baby Fatima seating adjustment were applied successfully."
                exit 0
              fi
            else
              echo "Attempt $attempt: production endpoint is not ready."
            fi
            sleep 10
          done
          echo "Production never reported final data $expected and seating adjustment $expected_adjustment." >&2
          exit 1

