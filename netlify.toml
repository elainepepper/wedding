[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.16.1"
  # Firebase's NEXT_PUBLIC values are deliberately bundled for the browser.
  # Keep scanning enabled for genuine server-side secrets.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_SITE_URL"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "haykalelaine-1ac3f.firebaseapp.com"
  # Firebase's installed TypeScript declarations contain example AIza keys.
  # Disable pattern guessing while retaining literal scanning for marked secrets.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next.js on Netlify needs the Next Runtime to serve the App Router + API routes.
# Without it, Netlify serves .next as static files and every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# The illustrated story is reused across every guest link. Cache its heavy
# artwork aggressively; keep the editable layout JSON fresh.
[[headers]]
  for = "/wedding/story/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/wedding/story/config.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
